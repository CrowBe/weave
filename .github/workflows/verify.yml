name: verify
on: [push, pull_request]

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mvp/package-lock.json
      - run: npm ci --prefix mvp
      - run: npm run verify
