# Red fixture for checks/no-swallowed-failures.mjs.
name: verify
on:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run verify
      - run: npm run lint
        continue-on-error: true
      - continue-on-error: true
        run: npm run audit
      - run: |
          npm run fmt
          npm run docs || true
      - run: 'npm run lint || true'
      - run: 'npm run check || exit 0'
  report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: npm run report
